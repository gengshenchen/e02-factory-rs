name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: e02-factory-rs-linux-x86_64
          - os: windows-latest
            artifact: e02-factory-rs-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # rodio/cpal 需要 ALSA 开发头（同 ci.yml；本工作流首次在 Linux 跑，
      # v0.3.0 首次发布因缺它构建失败）
      - name: 安装 ALSA 开发头（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Release 构建
        run: cargo build --release --locked

      # ---- 随包分发：BtbN LGPL 静态版 ffmpeg/ffprobe（n8.1 稳定分支）----
      - name: 下载静态 ffmpeg
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/ffmpeg-builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-lgpl-8.1.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-n8.1-latest-linux64-lgpl-8.1/bin/ffmpeg \
             /tmp/ffmpeg-n8.1-latest-linux64-lgpl-8.1/bin/ffprobe target/release/

      - name: 下载静态 ffmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/BtbN/ffmpeg-builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpegdl
          Get-ChildItem ffmpegdl -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination target/release/

      # ---- Linux: tar.gz + deb ----
      - name: 打包 tar.gz
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C target/release e02-factory-rs ffmpeg ffprobe

      - name: 构建 deb 安装包
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --output dist/e02-factory-rs_amd64.deb

      # ---- Windows: zip + MSI ----
      - name: 打包 zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/e02-factory-rs.exe,target/release/ffmpeg.exe,target/release/ffprobe.exe -DestinationPath dist/${{ matrix.artifact }}.zip

      # install 与编译分步：步骤级结论公开可读（job 日志要 admin 权限），
      # 再挂能从步骤名直接看出挂在安装还是编译
      - name: 安装 cargo-wix
        if: runner.os == 'Windows'
        run: cargo install cargo-wix --locked

      - name: 编译 MSI（cargo wix）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo wix *>&1 | Tee-Object -FilePath wix-build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem target/wix/*.msi | Move-Item -Destination dist/

      # MSI 首次构建未验证过；失败时把日志尾部写进 job summary（公开可读，
      # 无需仓库权限即可定位）
      - name: MSI 失败诊断
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          "# cargo-wix 日志（末 120 行）" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if (Test-Path wix-build.log) {
            Get-Content wix-build.log -Tail 120 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

      # 失败时留档 wix 日志（下载需登录，但仓库主人可直接取）
      - name: 上传 MSI 失败日志
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: wix-build-log
          path: wix-build.log
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # v0.1.0-alpha/beta/rc 后缀自动标记预发布，正式版不受影响
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
