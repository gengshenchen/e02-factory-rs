name: tools-build

# 产线 PC 侧工具的一次性入库：WiFi 吞吐测试用的 PC 端 iperf3。
# ESnet 官方源码不支持 mingw 交叉编译（sys/socket.h 等 POSIX 头无条件
# 包含，configure 的 socket 探测在 mingw 下静默 exit 1，改 LIBS 也过不了
# 编译），Windows 事实发行版是 ar51an/iperf3-win-builds（Cygwin 运行时，
# 不改官方源码，每版过 VirusTotal）。本工作流：钉死 tag + sha256 下载
# → Windows runner 冒烟（版本 + 本机回环自测，顺带确认 JSON 字段与上位机
# 解析器匹配）→ 提交 tools/ 进仓库。发布工作流只取用仓库里的成品。
# 升级 iperf3：改 ENV 版本号与 sha256（本地 curl 下载计算），手动跑一次。

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/tools-build.yml']

permissions:
  contents: write # 冒烟通过后把二进制提交回 main

# 重复触发只跑最新一次（旧 run 自动取消，避免堆积占 runner）
concurrency:
  group: tools-build
  cancel-in-progress: true

env:
  IPERF3_VER: '3.22'
  # ar51an/iperf3-win-builds release 3.22 的 iperf-3.22-win64.zip
  IPERF3_URL: https://github.com/ar51an/iperf3-win-builds/releases/download/3.22/iperf-3.22-win64.zip
  IPERF3_SHA256: C9FEABB3D721039508CCB81F74C2ADA3AE11B9E75D33D24510573C2AA21DA420
  # win64.zip = 无 OpenSSL 版（同上位机 --without-openssl 设计）；
  # 内容 iperf3.exe + cygwin1.dll（动态链接 Cygwin，两个文件须一起分发）

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 下载并校验 sha256
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:IPERF3_URL -OutFile iperf3.zip
          $h = (Get-FileHash -Algorithm SHA256 iperf3.zip).Hash
          if ($h -ne $env:IPERF3_SHA256) {
            Write-Output "::error title=sha256::期望 $env:IPERF3_SHA256 实际 $h——上游重新打包了？升级要重钉"
            exit 1
          }
          Expand-Archive iperf3.zip -DestinationPath .
          Get-ChildItem *.exe,*.dll | Select-Object Name,Length

      # 回环测试不涉防火墙；验证可执行 + JSON 字段齐全（上位机解析依赖）
      - name: 版本与本机回环自测
        shell: pwsh
        run: |
          .\iperf3.exe --version
          $p = Start-Process -FilePath .\iperf3.exe -ArgumentList "-s","-1","-p","19705" -PassThru -RedirectStandardOutput srv.log
          Start-Sleep -Seconds 2
          .\iperf3.exe -c 127.0.0.1 -p 19705 -t 2 -J | Tee-Object -FilePath cli.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $null = $p.WaitForExit(5000)
          $j = Get-Content cli.json -Raw | ConvertFrom-Json
          if (-not $j.end.sum_sent.bits_per_second) {
            Write-Output "::error title=smoke::缺 end.sum_sent.bits_per_second 字段（上位机解析依赖）"
            exit 1
          }
          "smoke ok: {0:N1} Mbps" -f ($j.end.sum_sent.bits_per_second / 1e6)

      - uses: actions/upload-artifact@v4
        with:
          name: iperf3-win64
          path: |
            iperf3.exe
            cygwin1.dll

  commit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: iperf3-win64
          path: tools-tmp

      - name: 提交 tools/iperf3-win64.exe + tools/cygwin1.dll
        run: |
          mkdir -p tools
          cp tools-tmp/iperf3.exe tools/iperf3-win64.exe
          cp tools-tmp/cygwin1.dll tools/cygwin1.dll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/
          if git diff --cached --quiet; then
            echo "二进制无变化，跳过提交"
            exit 0
          fi
          git commit -m "tools: iperf3-win64 ${IPERF3_VER} from ar51an/iperf3-win-builds (+cygwin1.dll, LGPL)"
          git push
