[package]
name = "e02-factory-rs"
version = "0.3.0"
edition = "2021"
description = "E02 工厂测试上位机（跨平台，Rust 重写）"
authors = ["gengshenchen <karlchen.me@outlook.com>"]

[dependencies]
eframe = "0.29"
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 固件输出为 GBK 编码时的回退解码（真机日志乱码，V3.6）
encoding_rs = "0.8"
# 录像回放声音（V3.6）：ffmpeg 抽成 wav 后本地播放
rodio = { version = "0.20", default-features = false, features = ["wav"] }

# deb 打包元数据（cargo deb 使用）
[package.metadata.deb]
maintainer = "gengshenchen <karlchen.me@outlook.com>"
depends = "$auto, ffmpeg"
section = "utils"
